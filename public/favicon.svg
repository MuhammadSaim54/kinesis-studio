<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#030409"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(139, 92, 246, 0.4)" stroke-width="2"/>
  <defs>
    <linearGradient id="favGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Kinetic Diamond -->
  <path d="M 32 10 L 54 32 L 32 54 L 10 32 Z" stroke="url(#favGrad)" stroke-width="3" stroke-dasharray="6 3" filter="url(#glow)"/>
  <!-- Inner Core Polygon -->
  <polygon points="32,18 44,32 32,46 20,32" fill="#06B6D4" fill-opacity="0.3" stroke="#06B6D4" stroke-width="2"/>
  <!-- Center Quantum Spark -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>
</svg>
